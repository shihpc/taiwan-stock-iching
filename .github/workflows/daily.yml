# 每日班（P2 D-2b）：當日 API → 原料包 → 增量檔 → 計分 → 一個 commit 進 main。
# **只 workflow_dispatch、刻意無 cron**（P2-KICKOFF §5 #3／#11）：主觸發＝taiwan-flow-live-v2 Worker 的 dispatch 角色
# （台北 22:30 一班＋23:30 補叫，裁定 Q3 甲），Worker 那端另案 PR。手動觸發可帶 date（補跑／重跑）。
# 產出全部由同一個 commit 收（docs/P2-DAILY-PLAN.md §7.3 原子性）；未齊時 commit runs/collect/<T>-waiting.json
# （pool.json 若依當日 TaiwanStockInfo 有變，也會一起進來——它是全域檔，不回滾）。
name: daily

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'T（YYYY-MM-DD，預設台北今日；狀態 last_date 之後到 T 的交易日全部補跑）'
        required: false
        default: ''
      max_days:
        description: '一次最多補跑幾個交易日（首次接種子或長假後補跑可調高）'
        required: false
        default: '5'

permissions:
  contents: write   # push 產出
  issues: write     # 失敗告警開 issue 用

concurrency:
  group: iching-commit
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安裝相依（numpy／requests；與 checks 同一份）
        run: pip install -r requirements-dev.txt

      - name: 每日班（抓當日原料、增量更新、計分落地）
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          RUN_DATE: ${{ inputs.date }}
          MAX_DAYS: ${{ inputs.max_days }}
        # --tpex-no-verify：GitHub runner 的 CA 缺 TPEx 憑證鏈的中繼憑證（run #2 實測 CERTIFICATE_VERIFY_FAILED），
        # 與回補層 backfill_hetzner.py 同一處理；只關 tpex.org.tw，其他主機照驗（twse.OfficialClient）
        run: |
          if [ -n "$RUN_DATE" ]; then
            python scripts/daily_run.py --root . --date "$RUN_DATE" --max-days "${MAX_DAYS:-5}" --tpex-no-verify
          else
            python scripts/daily_run.py --root . --max-days "${MAX_DAYS:-5}" --tpex-no-verify
          fi

      # P4 預覽版 web 索引（docs/P4-PREVIEW.md §0 #3／§3 末條）：由 data/scores/ 產 data/web/latest.json＋timeline.json，
      # 下面 `git add data` 會一起收。
      # ★ 這一步「絕不」讓自己的失敗擋到下面的 commit：分數檔（data/scores/）與原料包（runs/collect/）才是主產物，
      #   當日沒 commit 就得整班重跑；web 索引只是附屬品，明天再產一份即可。故失敗只記在 outputs.ok，
      #   紅燈延到 commit 之後才發（見「build web 失敗才轉紅燈」步驟），達成「主產物一定進 git ＋ 失敗仍看得見」。
      #   **不用 continue-on-error**——那會把失敗靜默吞掉（同 taiwan-flow-live-v2 intraday.yml 的 rrg base 慣例）。
      #   build_web.py 每檔先寫 .tmp 再 os.replace 不留半殘檔；仍保險地把 data/web/ 還原成 HEAD（已追蹤）
      #   ／清掉（尚未追蹤的首次 run），杜絕半套產物被 commit。
      - name: build web（data/web/latest.json＋timeline.json）
        id: web
        run: |
          if python scripts/build_web.py --root .; then
            echo "ok=1" >> "$GITHUB_OUTPUT"
          else
            rc=$?
            echo "::warning::build_web.py 失敗（exit $rc）→ 保留舊 data/web/（線上預覽停在前一版，該版自帶 date）；"\
                 "不影響分數檔與原料包 commit；本次 run 會在 commit 之後才轉紅燈"
            git checkout -- data/web/ 2>/dev/null || true
            git clean -fdq -- data/web/ 2>/dev/null || true
            echo "ok=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit & push（產出同一個 commit；遠端領先則 rebase 重試）
        run: |
          git config user.name "iching-daily[bot]"
          git config user.email "iching-daily@users.noreply.github.com"
          git add data runs/collect
          if git diff --cached --quiet; then
            echo "沒有產出變更（no-op 或已是最新）"; exit 0
          fi
          # 只看這次 staged 的檔決定訊息：有新原料包→日期；只有 waiting→標 waiting（set -eo pipefail 下 grep 無命中要 || true）
          staged=$(git diff --cached --name-only)
          last=$(echo "$staged" | grep -E 'runs/collect/[0-9-]+-daily\.json\.gz$' | sort | tail -1 | sed -E 's#.*/([0-9-]+)-daily.json.gz#\1#' || true)
          waiting=$(echo "$staged" | grep -E 'runs/collect/[0-9-]+-waiting\.json$' | sort | tail -1 | sed -E 's#.*/([0-9-]+)-waiting.json#\1#' || true)
          if [ -n "$last" ]; then msg="daily: $last"; elif [ -n "$waiting" ]; then msg="daily: waiting $waiting"; else msg="daily: update"; fi
          git commit -m "$msg $(TZ=Asia/Taipei date '+%F %H:%M')"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "push 失敗，重試 $i"; sleep $((i * 10))
          done
          exit 1

      # 排在 commit 之後才紅燈：讓 build_web 的失敗看得見（不被 continue-on-error 靜默吞掉），
      # 但此時分數檔與原料包已經 commit + push 完成，不會被連坐弄丟。
      - name: build web 失敗才轉紅燈
        if: steps.web.outputs.ok == '0'
        run: |
          echo "::error::build_web.py 失敗，data/web/ 未更新（分數檔與原料包已 commit 並 push，未受影響）"
          exit 1

      - name: Notify failure
        # cancelled 也要告警（failure() 在 cancelled 時不成立，2026-07-24 postmkt 教訓）
        if: failure() || cancelled()
        uses: ./.github/actions/notify-failure
        with:
          pipeline: iching-daily
